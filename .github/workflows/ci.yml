name: CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------- Backend Tests ---------------
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123456
          MYSQL_DATABASE: musicdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: ./mvnw test -B
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: musicdb
          DB_USERNAME: root
          DB_PASSWORD: test123456
          DB_USE_SSL: "false"
          JWT_SECRET: CITestSecretKeyThatIsAtLeast256BitsLongForJWTTokenGeneration12345678
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # --------------- Frontend Lint ---------------
  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.project }}
        run: npm run lint

      - name: Build check
        working-directory: ${{ matrix.project }}
        run: npm run build
