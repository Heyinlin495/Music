# 生产环境配置

# 数据库配置 - 生产环境必须使用SSL
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false&characterEncoding=UTF-8

# JPA配置 - 生产环境
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 日志级别 - 生产环境
logging.level.com.example.music=INFO
logging.level.org.hibernate.SQL=WARN
