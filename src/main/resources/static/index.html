<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0f0f0f; color: #fff; }
        .container { text-align: center; }
        h1 { font-size: 2rem; margin-bottom: 2rem; }
        a { display: inline-block; margin: 0.5rem 1rem; padding: 0.8rem 2rem; background: #1db954; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.2s; }
        a:hover { background: #1ed760; }
        .admin-link { background: #333; }
        .admin-link:hover { background: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Music</h1>
        <a href="/frontend/">Frontend</a>
        <a href="/admin/" class="admin-link">Admin</a>
    </div>
</body>
</html>
