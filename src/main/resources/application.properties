spring.application.name=Music
server.port=8080
java.awt.headless=true

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:musicdb}?useSSL=${DB_USE_SSL:false}&requireSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
music.upload.path=${MUSIC_UPLOAD_PATH:./uploads/music}
music.cover.path=${COVER_UPLOAD_PATH:./uploads/covers}
avatar.upload.path=${AVATAR_UPLOAD_PATH:./uploads/avatars}

# JWT Configuration (使用环境变量，默认值仅用于开发环境)
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# QQ Music API Configuration
qqmusic.api.base-url=${QQMUSIC_API_URL:http://localhost:3300}
qqmusic.audio.quality=${QQMUSIC_AUDIO_QUALITY:128}
qqmusic.api.qqmusic-key=${QQMUSIC_KEY:Q_H_L_63k3NWJJJoXu6j1_lZ8Rh6wfHjRrwxRSAGdo1vCVkI5YCT0AToK5Jheac7wQJRi5eQny5_m4Pi9wq2vueo_7yyfFU}

# Storage Configuration (local, minio, oss)
storage.type=${STORAGE_TYPE:local}

# MinIO Configuration
storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket-name=${MINIO_BUCKET:music}
storage.minio.secure=${MINIO_SECURE:false}

# Alibaba Cloud OSS Configuration
storage.oss.endpoint=${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
storage.oss.access-key-id=${OSS_ACCESS_KEY_ID:}
storage.oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
storage.oss.bucket-name=${OSS_BUCKET_NAME:music-files}
storage.oss.cdn-domain=${OSS_CDN_DOMAIN:}
