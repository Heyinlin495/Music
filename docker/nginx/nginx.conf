upstream backend_pool {
    zone backend_pool 64k;
    server backend:8080;
}

server {
    listen 80;
    server_name www.heyinlin.asia heyinlin.asia;

    client_max_body_size 1024m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # API reverse proxy
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }

    # Health endpoint
    location /api/health {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
    }

    # File serving (uploads)
    location /api/files/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }

    # Frontend SPA
    location /frontend/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Prevent browser from caching stale HTML/JS after deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Admin SPA
    location /admin/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root redirect to frontend
    location = / {
        return 302 /frontend/;
    }

    # Redirect /login and /register to frontend
    location = /login {
        return 302 /frontend/login;
    }
    location = /register {
        return 302 /frontend/register;
    }

    # Default: forward to backend
    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
